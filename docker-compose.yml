# Production-style stack. Usage:  cp .env.example .env && docker compose up --build
name: lantern
x-backend: &backend
  build: { context: ., dockerfile: deploy/backend.Dockerfile }
  env_file: .env
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER:-coffee}:${POSTGRES_PASSWORD:-coffee}@db:5432/${POSTGRES_DB:-coffee}
    REDIS_URL: redis://redis:6379/0
    MEDIA_ROOT: /app/media
  volumes:
    - media:/app/media
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coffee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coffee}
      POSTGRES_DB: ${POSTGRES_DB:-coffee}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    <<: *backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-coffee}:${POSTGRES_PASSWORD:-coffee}@db:5432/${POSTGRES_DB:-coffee}
      REDIS_URL: redis://redis:6379/0
      MEDIA_ROOT: /app/media
      RUN_MIGRATIONS: "1"
      RUN_COLLECTSTATIC: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live/', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency", "2"]
    depends_on:
      backend: { condition: service_healthy }

  beat:
    <<: *backend
    command: ["celery", "-A", "config", "beat", "-l", "info", "--schedule", "/tmp/celerybeat-schedule"]
    depends_on:
      backend: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: deploy/web.Dockerfile }
    ports: ["${WEB_PORT:-8080}:80"]
    volumes: [media:/media:ro]
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  media:
