<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% block title %}{{ brand_name }}{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#EFE4D0;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#EFE4D0;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="560" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:560px;background-color:#F7F0E3;border:1px solid #D9CBB0;">
          <tr>
            <td style="background-color:#2B1D16;padding:24px 32px;font-family:Georgia,'Times New Roman',serif;font-size:22px;line-height:28px;color:#F7F0E3;">
              {{ brand_name }}
            </td>
          </tr>
          {% block content %}{% endblock %}
          <tr>
            <td style="padding:24px 32px 32px 32px;border-top:1px solid #D9CBB0;font-family:Helvetica,Arial,sans-serif;font-size:13px;line-height:20px;color:#6B5A4E;">
              {% block footer %}Questions about your order? Reply to this email or write to
              <a href="mailto:{{ support_email }}" style="color:#B4602B;">{{ support_email }}</a>.{% endblock %}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
