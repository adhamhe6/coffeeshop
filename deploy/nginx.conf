upstream django { server backend:8000; keepalive 16; }

server {
    listen 80;
    server_name _;
    client_max_body_size 8m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location /api/        { proxy_pass http://django; }
    location /django-admin/ { proxy_pass http://django; }
    location = /healthz   { proxy_pass http://django; }
    location = /sitemap.xml { proxy_pass http://django; }
    location = /robots.txt  { proxy_pass http://django; }
    location /static/     { proxy_pass http://django; }   # Django admin assets via WhiteNoise
    location /media/ {
        alias /media/;   # shared volume written by Django
        expires 7d;
        add_header Cache-Control "public";
        # add_header in a location replaces the server-level headers, so security headers are repeated here.
        # Uploads are re-encoded WebP only; these headers keep any stray file inert if that ever changed.
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;
        try_files $uri =404;
    }

    # Hashed build assets are immutable.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location ~* \.(svg|ico|png|webp|jpg|woff2|txt|webmanifest)$ {
        root /usr/share/nginx/html;
        expires 7d;
        try_files $uri @shell;
    }

    # Every other navigation goes to Django's SEO shell, which serves index.html with per-page metadata.
    location / { try_files /nonexistent @shell; }
    location @shell { proxy_pass http://django; }
}
